name: React CI Frontend

# Se ejecuta cada vez que haces push o pull request a 'main' o 'develop'
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test-frontend:
    # Usamos un servidor de Ubuntu para ejecutar las acciones
    runs-on: ubuntu-latest

    steps:
      # 1. Clona tu repositorio
      - uses: actions/checkout@v4

      # 2. Configura Node.js (se recomienda usar la misma versión de desarrollo)
      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Puedes cambiar esto a la versión que uses

      # 3. Mueve a la carpeta Frontend e instala dependencias
      - name: Install Dependencies
        run: |
          cd Frontend
          npm install
          
      # 4. Ejecuta las pruebas unitarias (Si usas Jest/Vitest)
      # Nota: Este paso fallará si no tienes tests configurados en el script 'test'
      - name: Run Tests
        run: |
          cd Frontend
          npm test -- --watchAll=false # El flag desactiva el modo interactivo

      # 5. Construye la versión de producción
      - name: Build Frontend Production
        run: |
          cd Frontend
          npm run build # Verifica que el código se compile correctamente
