name: React CI Frontend

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: |
          cd Frontend
          npm install

      # Con esto se ejecuta el test real. Si falla, el pipeline se detendrá.
      - name: Run Tests
        run: |
          cd Frontend
          npm run test

      - name: Build Frontend
        run: |
          cd Frontend
          npm run build
